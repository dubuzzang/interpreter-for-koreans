  <meta name="description" content="말하면 바로 통역 — 한국어 · 튀르키예어 · 영어 · 일본어 · 중국어(간체 · 번체) · 베트남어 · 태국어 · 러시아어 · 아랍어. 마주 보기 대화, 답장 추천, 글 번역, 사진 번역(메뉴판·상품 포장·상세 이미지), 여행·거래 표현집과 내 표현, 대화 기록 공유, 한글 발음.">

  <meta property="og:description" content="말하면 바로 통역해서 읽어 줘요. 마주 보기 대화 · 글 번역 · 여행 표현집">

</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/talk" aria-label="Tercüman 처음 화면"><img src="/icons/icon.svg" alt="" width="28" height="28"><span>Tercüman</span></a>
    <button id="pair" class="pair" type="button"></button>
    <button id="gear" class="icon-btn" type="button" aria-label="설정"><span class="ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></span></button>
    <!-- 언어 버튼: 앱 코드(v1.2.0~)가 채우고 보이게 한다. 예전 버전 앱 코드에서는 숨은 채로 -->
    <button id="lang" class="lang-btn" type="button" aria-haspopup="menu" aria-expanded="false" hidden></button>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar" aria-label="메뉴"></nav>
  <noscript><p style="padding:24px">이 앱은 자바스크립트가 필요해요. · Bu uygulama JavaScript gerektirir. · This app needs JavaScript. · このアプリには JavaScript が必要です。 · 此应用需要 JavaScript。 · Ứng dụng này cần JavaScript. · แอปนี้ต้องใช้ JavaScript · Для работы приложения нужен JavaScript. · <span dir="rtl" lang="ar">يحتاج هذا التطبيق إلى JavaScript.</span></p></noscript>
  <script>
  // 새 버전 알림 · 업데이트 버튼 (문구는 저장된 언어로 — 앱 코드의 i18n.js를 못 쓰는 예전 버전에서도 뜨므로 여기에 따로 둔다).
  // 이 HTML은 열 때마다 서버에서 새로 받아서(서비스 워커도 페이지는 네트워크 먼저), 예전 버전 앱 코드가 돌고 있어도
  // 이 부분은 늘 최신이다 → 기존 사용자도 버튼 하나로 새 버전으로 바뀐다. 앱 코드(app.js)가 html의 data-version에 지금 버전을 적는다.
  (function () {
    var shown = false, latest = null;
    // [제목, 덧붙임, 업데이트 버튼, 바꾸는 중, 나중에] — 앱의 언어 결정(i18n.js startLangs)과 같은 순서로 언어를 고른다
    var TEXT = {
      ko: ['✨ 새 버전이 나왔어요', '기록은 그대로예요', '업데이트', '바꾸는 중…', '나중에'],
      tr: ['✨ Yeni sürüm hazır', 'Geçmişiniz korunur', 'Güncelle', 'Güncelleniyor…', 'Sonra'],
      en: ['✨ A new version is ready', 'Your history stays', 'Update', 'Updating…', 'Later'],
      ja: ['✨ 新しいバージョンがあります', '履歴はそのまま残ります', '更新', '更新中…', 'あとで'],
      zh: ['✨ 新版本已推出', '记录会保留', '更新', '正在更新…', '以后再说'],
      'zh-TW': ['✨ 新版本已推出', '紀錄會保留', '更新', '正在更新…', '稍後再說'],
      vi: ['✨ Đã có phiên bản mới', 'Lịch sử của bạn được giữ nguyên', 'Cập nhật', 'Đang cập nhật…', 'Để sau'],
      th: ['✨ มีเวอร์ชันใหม่แล้ว', 'ประวัติของคุณยังอยู่ครบ', 'อัปเดต', 'กำลังอัปเดต…', 'ไว้ทีหลัง'],
      ru: ['✨ Доступна новая версия', 'История сохранится', 'Обновить', 'Обновление…', 'Позже'],
      ar: ['✨ يتوفر إصدار جديد', 'سيبقى سجلك كما هو', 'تحديث', 'جارٍ التحديث…', 'لاحقًا'],
    };
    var FONT = {
      ja: '"Hiragino Sans","Yu Gothic UI",Meiryo,', zh: '"PingFang SC","Microsoft YaHei","Noto Sans SC",', 'zh-TW': '"PingFang TC","Microsoft JhengHei","Noto Sans TC",',
      th: '"Noto Sans Thai","Leelawadee UI",Thonburi,', ar: '"Noto Sans Arabic","Segoe UI","Geeza Pro",',
    };
    function lang() {
      try {
        var raw = JSON.parse(localStorage.getItem('tercuman.v1') || '{}');
        if (raw.settings || (raw.history && raw.history.length)) return raw.settings && TEXT[raw.settings.me] ? raw.settings.me : 'ko';
      } catch (e) {}
      var list = navigator.languages || [navigator.language];
      for (var i = 0; i < list.length; i++) {
        var tag = String(list[i] || '').toLowerCase().replace(/_/g, '-'), c = tag.split('-')[0];
        if (c === 'zh' && /-(hant|tw|hk|mo)(-|$)/.test(tag)) c = 'zh-TW'; // 대만 · 홍콩은 번체 (lang.js codeOfTag와 같게)
        if (TEXT[c]) return c;
      }
      return 'en';
    }
    var running = function () { return document.documentElement.getAttribute('data-version'); };
    function check() {
      return fetch('/version.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          latest = j && j.version;
          var cur = running();
          var update = Boolean(latest && cur && latest !== cur);
          if (update) show(latest, cur);
          return { update: update, latest: latest, current: cur };
        })
        .catch(function () { return { update: false, offline: true, current: running() }; });
    }
    function show(v, cur) {
      if (shown) return;
      shown = true;
      var L = lang(), T = TEXT[L];
      var bar = document.createElement('div');
      bar.lang = L;
      bar.dir = L === 'ar' ? 'rtl' : 'ltr';
      bar.id = 'update-banner';
      bar.setAttribute('role', 'status');
      bar.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(66px + env(safe-area-inset-top));z-index:60;display:flex;align-items:center;gap:10px;' +
        'padding:12px;padding-inline-start:16px;border-radius:16px;background:#1f2240;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.28);' +
        'font:600 15px/1.35 ' + (FONT[L] || '') + '-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;max-width:560px;margin:0 auto;overflow-wrap:anywhere;word-break:' + (L === 'ko' ? 'keep-all' : 'normal');
      var text = document.createElement('div');
      text.style.flex = '1';
      text.textContent = T[0];
      var sub = document.createElement('div');
      sub.style.cssText = 'font-weight:400;font-size:12.5px;opacity:.75;margin-top:2px';
      sub.textContent = 'v' + cur + ' → v' + v + ' · ' + T[1];
      text.appendChild(sub);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = T[2];
      btn.style.cssText = 'border:0;border-radius:12px;padding:10px 16px;background:#6366f1;color:#fff;font:inherit;cursor:pointer;white-space:nowrap';
      btn.onclick = function () { btn.disabled = true; btn.textContent = T[3]; apply(v); };
      var later = document.createElement('button');
      later.type = 'button';
      later.setAttribute('aria-label', T[4]);
      later.textContent = '✕';
      later.style.cssText = 'border:0;background:transparent;color:#fff;opacity:.6;font:inherit;font-size:18px;padding:4px 6px;cursor:pointer';
      later.onclick = function () { bar.remove(); shown = false; };
      bar.appendChild(text); bar.appendChild(btn); bar.appendChild(later);
      document.body.appendChild(bar);
    }
    // 새 서비스 워커를 받아 바로 적용하고, 예전 버전 파일 보관함을 지운 뒤 새로 고친다
    function apply(v) {
      var reload = function () { location.reload(); };
      var dropOld = function () {
        if (!window.caches) return Promise.resolve();
        return caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (k) { return k.indexOf('tercuman-') === 0 && k !== 'tercuman-' + v; }).map(function (k) { return caches.delete(k); }));
        });
      };
      var sw = navigator.serviceWorker;
      var ready = sw && sw.getRegistration ? sw.getRegistration().then(function (reg) {
        if (!reg) return;
        return reg.update().catch(function () {}).then(function () {
          var w = reg.installing || reg.waiting;
          if (!w) return;
          return new Promise(function (done) {
            w.postMessage('SKIP_WAITING');
            w.addEventListener('statechange', function () { if (w.state === 'activated' || w.state === 'redundant') done(); });
            setTimeout(done, 8000);
          });
        });
      }).catch(function () {}) : Promise.resolve();
      ready.then(dropOld).then(reload, reload);
    }
    window.__tercumanUpdate = {
      check: check,
      apply: function () { return latest ? apply(latest) : check().then(function (r) { if (r.update) apply(r.latest); }); },
    };
    addEventListener('load', function () { setTimeout(check, 1500); });
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
    setInterval(check, 30 * 60 * 1000);
  })();
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
